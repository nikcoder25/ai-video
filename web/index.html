<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UGC Ad Factory</title>
<style>
  :root {
    --bg: #0c0e12; --panel: #14171d; --panel2: #1a1e26; --line: #262b35;
    --text: #e8eaf0; --dim: #8b93a3; --accent: #ffe24b; --accent-ink: #171204;
    --ok: #4ade80; --err: #f87171; --run: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: 0.2px; }
  h1 .spark { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 { font-size: 14px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }

  label { display: block; font-size: 12.5px; color: var(--dim); margin: 12px 0 5px; }
  input[type="text"], input[type="url"], textarea {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: #3b4453; }
  textarea { resize: vertical; min-height: 64px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim); font: inherit; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .drop {
    margin-top: 6px; border: 1.5px dashed var(--line); border-radius: 10px;
    padding: 18px; text-align: center; color: var(--dim); font-size: 13px; cursor: pointer;
  }
  .drop.hover { border-color: var(--accent); color: var(--text); }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .thumbs img, .thumbs video { width: 64px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }

  .submit {
    width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 800;
    font-size: 15px; cursor: pointer; letter-spacing: 0.3px;
  }
  .submit:disabled { opacity: 0.45; cursor: default; }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .error-msg { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 18px; }

  .job { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; background: var(--panel2); }
  .job-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .job-title { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; flex: none; }
  .badge.queued { background: #2a2f3a; color: var(--dim); }
  .badge.running { background: rgba(96,165,250,0.15); color: var(--run); }
  .badge.completed { background: rgba(74,222,128,0.14); color: var(--ok); }
  .badge.failed { background: rgba(248,113,113,0.14); color: var(--err); }
  .progress { color: var(--dim); font-size: 12.5px; margin-top: 6px; min-height: 16px; }
  .ads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  @media (max-width: 560px) { .ads { grid-template-columns: 1fr; } }
  .ad video { width: 100%; aspect-ratio: 9/16; border-radius: 8px; background: #000; border: 1px solid var(--line); }
  .ad .hook { font-size: 12px; color: var(--dim); margin: 6px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad a { color: var(--accent); font-size: 12.5px; text-decoration: none; font-weight: 700; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="spark">▶</span> UGC Ad Factory</h1>
    <span class="sub">product in → 3 expert-edited ads out</span>
  </header>

  <div class="grid">
    <div class="card">
      <h2>New job</h2>
      <div class="tabs">
        <button id="tab-url" class="active" type="button">Product URL</button>
        <button id="tab-manual" type="button">Title + Photos</button>
      </div>

      <div id="pane-url">
        <label>Product page URL</label>
        <input id="f-url" type="url" placeholder="https://your-store.com/products/neck-fan" />
      </div>

      <div id="pane-manual" style="display:none">
        <label>Product title</label>
        <input id="f-title" type="text" placeholder="Portable Neck Fan" />
        <label>Description (optional)</label>
        <textarea id="f-desc" placeholder="Hands-free bladeless fan, 3 speeds, 8h battery…"></textarea>
        <label>Price (optional)</label>
        <input id="f-price" type="text" placeholder="₹1,499" />
        <label>Photos / clips (up to 6)</label>
        <div id="drop" class="drop">Click or drop images / short videos here</div>
        <input id="f-files" type="file" accept="image/*,video/mp4,video/quicktime" multiple style="display:none" />
        <div id="thumbs" class="thumbs"></div>
      </div>

      <button id="submit" class="submit" type="button">Generate 3 ads</button>
      <div id="err" class="error-msg"></div>
      <div class="note">Renders take a few minutes. Each job produces 3 variants with different hooks.</div>
    </div>

    <div class="card">
      <h2>Jobs</h2>
      <div id="jobs"><div class="empty">No jobs yet — submit one to get started.</div></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let mode = "url";
  let uploaded = []; // server paths returned by /uploads

  // --- tabs ---
  const setMode = (m) => {
    mode = m;
    $("tab-url").classList.toggle("active", m === "url");
    $("tab-manual").classList.toggle("active", m === "manual");
    $("pane-url").style.display = m === "url" ? "" : "none";
    $("pane-manual").style.display = m === "manual" ? "" : "none";
  };
  $("tab-url").onclick = () => setMode("url");
  $("tab-manual").onclick = () => setMode("manual");

  // --- uploads ---
  const drop = $("drop"), fileInput = $("f-files"), thumbs = $("thumbs");
  drop.onclick = () => fileInput.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("hover"); };
  drop.ondragleave = () => drop.classList.remove("hover");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("hover"); handleFiles(e.dataTransfer.files); };
  fileInput.onchange = () => handleFiles(fileInput.files);

  async function handleFiles(files) {
    for (const file of files) {
      if (uploaded.length >= 6) break;
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/uploads", { method: "POST", body: fd });
        if (!res.ok) throw new Error((await res.json()).error || res.status);
        const { path } = await res.json();
        uploaded.push(path);
        const el = file.type.startsWith("video")
          ? Object.assign(document.createElement("video"), { src: URL.createObjectURL(file), muted: true })
          : Object.assign(document.createElement("img"), { src: URL.createObjectURL(file) });
        thumbs.appendChild(el);
      } catch (e) { showErr("Upload failed: " + e.message); }
    }
  }

  const showErr = (m) => { $("err").textContent = m; setTimeout(() => ($("err").textContent = ""), 6000); };

  // --- submit ---
  $("submit").onclick = async () => {
    const body = {};
    if (mode === "url") {
      const url = $("f-url").value.trim();
      if (!url) return showErr("Enter a product URL.");
      body.url = url;
    } else {
      const title = $("f-title").value.trim();
      if (!title) return showErr("Enter a product title.");
      if (uploaded.length === 0) return showErr("Upload at least one photo or clip.");
      body.title = title;
      if ($("f-desc").value.trim()) body.description = $("f-desc").value.trim();
      if ($("f-price").value.trim()) body.price = $("f-price").value.trim();
      body.photos = uploaded;
    }
    $("submit").disabled = true;
    try {
      const res = await fetch("/jobs", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json()).error || res.status);
      uploaded = []; thumbs.innerHTML = ""; $("f-url").value = ""; $("f-title").value = "";
      await refresh();
    } catch (e) { showErr("Submit failed: " + e.message); }
    $("submit").disabled = false;
  };

  // --- job list ---
  async function refresh() {
    try {
      const jobs = await (await fetch("/jobs")).json();
      const box = $("jobs");
      if (!jobs.length) { box.innerHTML = '<div class="empty">No jobs yet — submit one to get started.</div>'; return; }
      box.innerHTML = jobs.map(renderJob).join("");
    } catch { /* server restarting; keep last view */ }
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  function renderJob(j) {
    const title = esc(j.title || j.id.slice(0, 8));
    const ads = (j.results || []).map((r) => `
      <div class="ad">
        ${r.video ? `<video src="${esc(r.video)}" controls preload="metadata"></video>` : ""}
        <div class="hook">${esc(r.hook)}</div>
        ${r.video ? `<a href="${esc(r.video)}" download>Download MP4</a>` : `<a href="${esc(r.props)}">props.json</a>`}
      </div>`).join("");
    return `
      <div class="job">
        <div class="job-head">
          <div class="job-title">${title}</div>
          <span class="badge ${esc(j.status)}">${esc(j.status)}</span>
        </div>
        <div class="progress">${esc(j.error || j.progress || "")}</div>
        ${ads ? `<div class="ads">${ads}</div>` : ""}
      </div>`;
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
