services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides .env so the container writes to its volume, not the repo.
      WORK_DIR: /data/work
      STORAGE_DIR: /data/clips
      DATABASE_URL: sqlite:////data/clipviral.db
      CORS_ORIGINS: ${SITE_ORIGIN:-http://localhost}
    volumes:
      - clipviral-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so this must be a build
        # arg. Caddy strips /api before proxying to the backend.
        NEXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your domain for automatic HTTPS; defaults to plain local HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  clipviral-data:
  caddy-data:
  caddy-config:
